[package]
name = "cadence"
description = "Cadence, a desktop autoclicker application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cadence-core.workspace = true
cadence-platform.workspace = true
directories.workspace = true
log.workspace = true
slint.workspace = true
toml.workspace = true

[build-dependencies]
slint-build.workspace = true
winresource.workspace = true

[dev-dependencies]
# Integration tests observe injected input with the platform's test helpers.
cadence-platform = { workspace = true, features = ["diagnostics"] }

# The GUI test drives a real window, which must run on the main thread.
[[test]]
name = "gui"
harness = false

[lints]
workspace = true
